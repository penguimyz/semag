<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>playing…</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0e0e10; overflow: hidden;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    color: #e6e6e6;
  }
  #frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%; border: 0;
    display: block; background: #000;
  }
  #bar {
    position: fixed; top: 12px; left: 12px;
    z-index: 2147483647;
    display: flex; gap: 8px;
    opacity: 0.25;
    transition: opacity 0.15s ease;
  }
  #bar:hover, #bar.show { opacity: 1; }
  #bar button {
    all: unset; cursor: pointer;
    padding: 6px 12px;
    background: rgba(20, 20, 24, 0.9);
    border: 1px solid #33333c;
    border-radius: 8px;
    color: #e6e6e6;
    font: inherit; font-weight: 600;
    backdrop-filter: blur(6px);
  }
  #bar button:hover {
    background: rgba(35, 35, 42, 0.95);
    border-color: #4a4a55;
  }
  /* the blank cover — plain white, looks like about:blank */
  #blank {
    position: fixed; inset: 0;
    z-index: 2147483646;
    background: #ffffff;
    display: none;
  }
  #blank.on { display: block; }
</style>
</head>
<body>

<iframe id="frame" src="about:blank"
        allow="fullscreen; autoplay; gamepad; microphone; camera; clipboard-read; clipboard-write"></iframe>

<div id="bar">
  <button id="back" title="back to launcher">← back</button>
  <button id="blankBtn" title="flip to about:blank (press \ or back)">blank</button>
  <button id="full" title="fullscreen">⛶</button>
</div>

<div id="blank"></div>

<script>
  const params = new URLSearchParams(location.search);
  const g = params.get("g") || "";

  if (!g || g.includes("..") || g.startsWith("/") || g.includes("://")) {
    location.replace("index.html");
  }

  const frame = document.getElementById("frame");
  frame.src = "games/" + g;

  const blank = document.getElementById("blank");
  const bar = document.getElementById("bar");

  // was the blank state pushed via history (so back should unblank)?
  let blanked = false;

  function showBlank() {
    if (blanked) return;
    blanked = true;
    blank.classList.add("on");
    // change the tab title + URL bar without unloading the iframe
    document.title = "about:blank";
    try {
      history.pushState({ blank: true }, "", "about:blank");
    } catch (e) {
      // some Chrome builds refuse cross-scheme pushState — fall back
      try { history.pushState({ blank: true }, "", "#blank"); } catch (_) {}
    }
  }

  function hideBlank() {
    if (!blanked) return;
    blanked = false;
    blank.classList.remove("on");
    document.title = "playing…";
  }

  // clicking blank toggles into about:blank mode
  document.getElementById("blankBtn").addEventListener("click", () => {
    if (blanked) {
      // un-blank via history so back stays consistent
      history.back();
    } else {
      showBlank();
    }
  });

  // back button of the bar → return to the launcher
  document.getElementById("back").addEventListener("click", () => {
    location.href = "index.html";
  });

  // browser back (or swipe) while blanked → un-blank instead of leaving the page
  window.addEventListener("popstate", () => {
    if (blanked) hideBlank();
  });

  // backslash toggles the same way
  document.addEventListener("keydown", (e) => {
    if (e.key === "\\") {
      e.preventDefault();
      if (blanked) history.back();
      else showBlank();
    }
    if (e.key === "Escape" && blanked) history.back();
  });

  // fullscreen
  document.getElementById("full").addEventListener("click", () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  });

  bar.classList.add("show");
  setTimeout(() => bar.classList.remove("show"), 1500);
</script>
</body>
</html>
