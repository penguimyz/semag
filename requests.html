<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>requests · semag</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.4 system-ui, -apple-system, sans-serif;
    background: #0e0e10;
    color: #e6e6e6;
    min-height: 100vh;
  }
  header {
    padding: 32px 24px 16px;
    border-bottom: 1px solid #1e1e22;
  }
  h1 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  p.sub { margin: 4px 0 0; color: #8a8a92; font-size: 14px; }
  main {
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  a.back {
    display: inline-block;
    font-size: 13px;
    color: #8a8a92;
    text-decoration: none;
    margin-bottom: 16px;
  }
  a.back:hover { color: #e6e6e6; }
  a.submit {
    display: inline-block;
    padding: 10px 14px;
    background: #16161a;
    border: 1px solid #23232a;
    border-radius: 10px;
    color: #e6e6e6;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 24px;
    transition: background 0.12s, border-color 0.12s;
  }
  a.submit:hover { background: #1d1d23; border-color: #33333c; }
  .item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 0;
    border-top: 1px solid #1e1e22;
  }
  .item:last-child { border-bottom: 1px solid #1e1e22; }
  .item .info { flex: 1; min-width: 0; }
  .item .name {
    font-weight: 600;
    color: #e6e6e6;
    text-decoration: none;
  }
  .item .name:hover { text-decoration: underline; }
  .item .meta {
    font-size: 12px;
    color: #8a8a92;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .like {
    font: inherit;
    font-size: 12px;
    background: #16161a;
    border: 1px solid #23232a;
    color: #b0b0b8;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .like:hover { background: #1d1d23; border-color: #33333c; color: #e6e6e6; }
  .like.done { border-color: #33333c; color: #e6e6e6; }
  .msg { color: #55555c; font-size: 14px; padding: 16px 0; }
  footer {
    text-align: center;
    padding: 24px;
    color: #55555c;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>requests</h1>
  <p class="sub">ask for a game or +1 one you want</p>
</header>
<main>
  <a class="back" href="index.html">← back</a><br>
  <a class="submit" href="https://github.com/penguimyz/semag/issues/new?template=game-request.md" target="_blank" rel="noopener">new request</a>
  <div id="list"><div class="msg">loading…</div></div>
</main>
<footer>static · github pages</footer>

<script>
  const REPO = "penguimyz/semag";
  const LABEL = "game-request";
  const liked = new Set(JSON.parse(localStorage.getItem("liked") || "[]"));
  const list = document.getElementById("list");

  fetch(`https://api.github.com/repos/${REPO}/issues?labels=${LABEL}&state=open&per_page=50`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => { list.innerHTML = '<div class="msg">couldnt load requests</div>'; });

  function render(issues) {
    if (!issues.length) {
      list.innerHTML = '<div class="msg">nothing here yet</div>';
      return;
    }
    list.innerHTML = "";
    for (const it of issues) {
      const n = (it.reactions && it.reactions["+1"]) || 0;
      const isLiked = liked.has(it.number);
      const body = (it.body || "").replace(/\s+/g, " ").trim();

      const row = document.createElement("div");
      row.className = "item";

      const info = document.createElement("div");
      info.className = "info";

      const name = document.createElement("a");
      name.className = "name";
      name.href = it.html_url;
      name.target = "_blank";
      name.rel = "noopener";
      name.textContent = it.title;
      info.appendChild(name);

      if (body) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = body;
        info.appendChild(meta);
      }

      const btn = document.createElement("button");
      btn.className = "like" + (isLiked ? " done" : "");
      btn.textContent = "+1 " + n;
      btn.addEventListener("click", () => {
        if (!liked.has(it.number)) {
          liked.add(it.number);
          localStorage.setItem("liked", JSON.stringify([...liked]));
          btn.textContent = "+1 " + (n + 1);
          btn.classList.add("done");
        }
        window.open(it.html_url, "_blank", "noopener");
      });

      row.appendChild(info);
      row.appendChild(btn);
      list.appendChild(row);
    }
  }
</script>
</body>
</html>
