<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>requests · semag</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.4 system-ui, -apple-system, sans-serif;
    background: #0e0e10;
    color: #e6e6e6;
    min-height: 100vh;
  }
  header {
    padding: 32px 24px 16px;
    border-bottom: 1px solid #1e1e22;
  }
  h1 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  p.sub { margin: 4px 0 0; color: #8a8a92; font-size: 14px; }
  main {
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  a.back {
    display: inline-block;
    font-size: 13px;
    color: #8a8a92;
    text-decoration: none;
    margin-bottom: 16px;
  }
  a.back:hover { color: #e6e6e6; }
  a.submit {
    display: inline-block;
    padding: 10px 14px;
    background: #16161a;
    border: 1px solid #23232a;
    border-radius: 10px;
    color: #e6e6e6;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 24px;
    transition: background 0.12s, border-color 0.12s;
  }
  a.submit:hover { background: #1d1d23; border-color: #33333c; }
  .warn {
    font-size: 12px;
    color: #8a8a92;
    border-left: 2px solid #33333c;
    padding: 4px 0 4px 10px;
    margin: 0 0 20px;
  }
  .item {
    padding: 14px 0;
    border-top: 1px solid #1e1e22;
  }
  .item:last-child { border-bottom: 1px solid #1e1e22; }
  .item .name { font-weight: 600; color: #e6e6e6; }
  .item .meta {
    font-size: 13px;
    color: #8a8a92;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .msg { color: #55555c; font-size: 14px; padding: 16px 0; }
  footer {
    text-align: center;
    padding: 24px;
    color: #55555c;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>requests</h1>
  <p class="sub">ask for a game to be added</p>
</header>
<main>
  <a class="back" href="index.html">← back</a><br>
  <a class="submit" href="https://forms.gle/CX6uApnphR4vgy968" target="_blank" rel="noopener">new request</a>
  <p class="warn">no online games like roblox — too hard to host</p>
  <div id="list"><div class="msg">loading…</div></div>
</main>
<footer>static · github pages</footer>

<script>
  const CSV_URL = "PASTE_YOUR_CSV_URL_HERE";
  const list = document.getElementById("list");

  if (CSV_URL.includes("PASTE_")) {
    list.innerHTML = '<div class="msg">csv url not set — see setup notes</div>';
  } else {
    fetch(CSV_URL)
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(csv => render(parseCSV(csv)))
      .catch(() => { list.innerHTML = '<div class="msg">couldnt load requests</div>'; });
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ""));
  }

  function render(rows) {
    if (rows.length < 2) {
      list.innerHTML = '<div class="msg">nothing here yet</div>';
      return;
    }

    const headers = rows[0].map(h => h.toLowerCase().trim());
    const nameIdx = headers.findIndex(h => h.includes("game"));
    const whyIdx  = headers.findIndex(h => h.includes("why") || h.includes("added"));

    if (nameIdx === -1) {
      list.innerHTML = '<div class="msg">couldnt find a "game name" column</div>';
      return;
    }

    list.innerHTML = "";
    const data = rows.slice(1);
    for (let i = data.length - 1; i >= 0; i--) {
      const r = data[i];
      const name = (r[nameIdx] || "").trim();
      const why  = whyIdx >= 0 ? (r[whyIdx] || "").trim() : "";
      if (!name) continue;

      const item = document.createElement("div");
      item.className = "item";

      const nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = name;
      item.appendChild(nm);

      if (why) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = why;
        item.appendChild(m);
      }

      list.appendChild(item);
    }
  }
</script>
</body>
</html>
